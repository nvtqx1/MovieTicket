spring.application.name=Backend
# ==========================================
# CAU HINH KET NOI DATABASE (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=190305
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CAU HINH HIBERNATE (JPA)
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# ==========================================
# CAU HINH FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true