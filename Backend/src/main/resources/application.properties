spring.application.name=Backend

# =========================
# SERVER
# =========================
server.address=0.0.0.0
server.port=${PORT:10000}
server.servlet.context-path=/api

# =========================
# MYSQL
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

# =========================
# JWT
# =========================
ticketrush.app.jwtSecret=${JWT_SECRET}
ticketrush.app.jwtExpirationMs=3600000

# =========================
# REDIS
# =========================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# =========================
# KAFKA
# =========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=SSL

spring.kafka.properties.ssl.keystore.type=PKCS12
spring.kafka.properties.ssl.keystore.location=/app/certs/client.keystore.p12
spring.kafka.properties.ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
spring.kafka.properties.ssl.key.password=${KAFKA_KEY_PASSWORD}

spring.kafka.properties.ssl.truststore.type=JKS
spring.kafka.properties.ssl.truststore.location=/app/certs/client.truststore.jks
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}

spring.kafka.consumer.group-id=movie-ticket-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =========================
# QUEUE
# =========================
ticketrush.queue.topic=ticket_requests
ticketrush.queue.jwt-expiration-ms=300000