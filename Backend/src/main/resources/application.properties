spring.application.name=Backend

# ==========================================
# CAU HINH THONG TIN SERVER
# ==========================================
server.port=8080
server.servlet.context-path=/api

# ==========================================
# CAU HINH KET NOI DATABASE (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=minhgiangnguyen159
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CAU HINH HIBERNATE (JPA)
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================================
# CAU HINH FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true


# ==========================================
# CAU HINH JWT
# ==========================================
ticketrush.app.jwtSecret=UqC2dkPJZQQQm0KyQcyl6IYx7P1GZgYHkGQFB8TnW+8QYoHpZi5p0AfXs1Oe5KIELHMjdnMhXzmW4AYxITXDOw==
ticketrush.app.jwtExpirationMs=3600000

# ==========================================
# CAU HINH REDIS
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
ticketrush.seat-lock.ttl-seconds=600

# ==========================================
# CAU HINH KAFKA
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Cau hinh Consumer (Nguoi nhan tin nhan tu Kafka)
spring.kafka.consumer.group-id=movie-ticket-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Cau hinh Producer (Nguoi day tin nhan vao Kafka)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer